<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Boat Tracking | MarineLoRa</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Marine<span>LoRa</span>
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="dashboard.html">
                    Dashboard
                </a>
            </li>

            <li>
                <a href="register.html">
                    Register Boat
                </a>
            </li>

        </ul>

    </nav>


    <main class="dashboard-page">


        <div class="dashboard-header">

            <h1>Boat Tracking</h1>

            <p>
                View the latest received boat location
            </p>

        </div>


        <section class="map-container">

            <div class="map-placeholder">

                <div>

                    <h2>
                        📍 Boat Location
                    </h2>

                    <p>
                        Waiting for GPS coordinates...
                    </p>

                </div>

            </div>

        </section>


        <section class="messages-section">

            <h2>
                Latest Location
            </h2>

            <div id="locationDetails">

                <div class="empty-state">

                    <h3>
                        No location available
                    </h3>

                    <p>
                        LoRa GPS data will appear here.
                    </p>

                </div>

            </div>

        </section>


    </main>


    <footer class="footer">

        <p>
            © 2026 <span>MarineLoRa</span>
        </p>

    </footer>


    <script src="js/tracking.js"></script>

</body>

</html>
