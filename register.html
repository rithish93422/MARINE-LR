<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Register Boat | MarineLoRa</title>

    <link rel="stylesheet" href="style.css">

</head>


<body>


    <!-- NAVBAR -->

    <nav class="navbar">

        <div class="logo">
            Marine<span>LoRa</span>
        </div>

        <div class="nav-text">
            Boat Registration
        </div>

    </nav>


    <!-- REGISTRATION -->

    <main class="form-page">

        <div class="form-card">

            <div class="boat-icon">
                
            </div>

            <h1>
                Register Your Boat
            </h1>

            <p class="form-description">
                Connect your boat to the Marine LoRa
                communication network.
            </p>


            <!-- BOAT NAME -->

            <label>
                Boat Name
            </label>

            <input
                type="text"
                id="boatName"
                placeholder="Enter boat name"
            >


            <!-- BOAT NUMBER -->

            <label>
                Boat Number
            </label>

            <input
                type="text"
                id="boatNumber"
                placeholder="Example: TN-37-AB-1234"
            >


            <!-- LORA ID -->

            <label>
                LoRa Device ID
            </label>

            <input
                type="text"
                id="loraId"
                placeholder="Example: LORA-001"
            >


            <!-- PHONE -->

            <label>
                Owner Phone Number
            </label>

            <div class="phone-input">

                <span>+91</span>

                <input
                    type="tel"
                    id="phoneNumber"
                    placeholder="10-digit mobile number"
                    maxlength="10"
                >

            </div>


            <!-- SEND OTP -->

            <button
                class="button full-button"
                onclick="sendOTP()"
                id="sendOtpButton"
            >
                SEND OTP
            </button>


            <!-- OTP SECTION -->

            <div
                id="otpSection"
                class="otp-section"
                style="display:none;"
            >

                <div class="otp-box">

                    <h3>
                         Phone Verification
                    </h3>

                    <p>
                        Demo verification code:
                    </p>

                    <div
                        id="demoOTP"
                        class="demo-otp"
                    >
                        ------
                    </div>

                    <small>
                        Demo mode — no SMS is sent.
                    </small>

                </div>


                <label>
                    Enter OTP
                </label>

                <input
                    type="text"
                    id="otp"
                    maxlength="6"
                    placeholder="Enter 6-digit OTP"
                >


                <button
                    class="button full-button"
                    onclick="verifyOTP()"
                >
                    VERIFY & CONTINUE →
                </button>

            </div>


            <!-- BACK -->

            <a
                href="index.html"
                class="back-link"
            >
                ← Back to Home
            </a>

        </div>

    </main>


    <!-- JAVASCRIPT -->

    <script>

        let generatedOTP = "";


        // ===============================
        // SEND OTP
        // ===============================

        function sendOTP() {

            const boatName =
                document.getElementById("boatName")
                .value.trim();

            const boatNumber =
                document.getElementById("boatNumber")
                .value.trim();

            const loraId =
                document.getElementById("loraId")
                .value.trim();

            const phone =
                document.getElementById("phoneNumber")
                .value.trim();


            if (boatName === "") {

                alert("Please enter boat name.");
                return;

            }


            if (boatNumber === "") {

                alert("Please enter boat number.");
                return;

            }


            if (loraId === "") {

                alert("Please enter LoRa Device ID.");
                return;

            }


            if (!/^LORA-[0-9]{3,}$/i.test(loraId)) {

                alert("Use LoRa ID like LORA-001.");
                return;

            }


            if (!/^[0-9]{10}$/.test(phone)) {

                alert("Enter a valid 10-digit phone number.");
                return;

            }


            // Generate OTP

            generatedOTP =
                Math.floor(
                    100000 +
                    Math.random() * 900000
                ).toString();


            // Save boat information

            localStorage.setItem(
                "boatName",
                boatName
            );

            localStorage.setItem(
                "boatNumber",
                boatNumber
            );

            localStorage.setItem(
                "loraId",
                loraId.toUpperCase()
            );

            localStorage.setItem(
                "phoneNumber",
                phone
            );


            // Show OTP

            document.getElementById("demoOTP")
                .textContent = generatedOTP;

            document.getElementById("otpSection")
                .style.display = "block";


            document.getElementById("sendOtpButton")
                .textContent = "OTP GENERATED ✓";


            alert(
                "Demo OTP generated successfully."
            );

        }


        // ===============================
        // VERIFY OTP
        // ===============================

        function verifyOTP() {

            const enteredOTP =
                document.getElementById("otp")
                .value.trim();


            if (enteredOTP === "") {

                alert("Please enter the OTP.");
                return;

            }


            if (enteredOTP === generatedOTP) {

                localStorage.setItem(
                    "phoneVerified",
                    "true"
                );


                alert(
                    "Phone number verified successfully!"
                );


                window.location.href =
                    "tracking.html";

            }

            else {

                alert(
                    "Incorrect OTP. Please try again."
                );

            }

        }

    </script>


</body>

</html>
