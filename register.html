<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Register Boat | MarineLoRa</title>

    <link rel="stylesheet" href="style.css">

</head>

<body>

    <nav class="navbar">

        <div class="logo">
            Marine<span>LoRa</span>
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            <li>
                <a href="tracking.html">Tracking</a>
            </li>

        </ul>

    </nav>


    <section class="auth-page">

        <div class="auth-card">

            <h1>Register Your Boat</h1>

            <p class="subtitle">
                Connect your boat to the MarineLoRa communication network
            </p>


            <form id="registerForm">


                <div class="form-group">

                    <label for="boatName">
                        Boat Name
                    </label>

                    <input
                        type="text"
                        id="boatName"
                        class="form-control"
                        placeholder="Enter boat name"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="boatNumber">
                        Boat Number
                    </label>

                    <input
                        type="text"
                        id="boatNumber"
                        class="form-control"
                        placeholder="Example: TN-37-AB-1234"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loraId">
                        LoRa Device ID
                    </label>

                    <input
                        type="text"
                        id="loraId"
                        class="form-control"
                        placeholder="Example: LORA-001"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="phone">
                        Owner Phone Number
                    </label>

                    <div class="phone-input">

                        <span>+91</span>

                        <input
                            type="tel"
                            id="phone"
                            class="form-control"
                            placeholder="10-digit mobile number"
                            maxlength="10"
                            required
                        >

                    </div>

                </div>


                <button
                    type="submit"
                    class="btn btn-primary register-btn"
                >
                    SEND OTP
                </button>


            </form>


            <a
                href="index.html"
                class="back-home"
            >
                ← Back to Home
            </a>

        </div>

    </section>


    <script src="js/register.js"></script>

</body>

</html>
